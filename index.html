<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Plan d'Entraînement</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between">

    <!-- ÉCRAN D'AUTHENTIFICATION -->
    <div id="auth-screen" class="fixed inset-0 bg-dark-950/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 mb-3 text-xl">
                    <i class="fa-solid fa-person-running"></i>
                </div>
                <h2 id="auth-title" class="text-2xl font-bold">Connexion à ton Plan</h2>
                <p class="text-slate-400 text-sm mt-1">Sécurisé et synchronisé partout</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Courriel</label>
                    <input type="email" id="email" required class="w-full bg-dark-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Mot de passe</label>
                    <input type="password" id="password" required class="w-full bg-dark-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-900/30">
                    Se connecter
                </button>
            </form>

            <div class="mt-6 text-center">
                <button id="auth-toggle-mode" class="text-sm text-emerald-400 hover:underline">
                    Pas encore de compte ? S'inscrire
                </button>
            </div>
            <div id="auth-error" class="mt-4 text-red-400 text-sm text-center hidden"></div>
        </div>
    </div>

    <!-- APPLICATION PRINCIPALE -->
    <div id="app-content" class="hidden flex-1 flex flex-col">
        <!-- HEADER -->
        <header class="bg-dark-800 border-b border-slate-700 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h1 class="font-bold text-lg tracking-tight">Mon Plan Sportif</h1>
            </div>
            <div class="flex items-center space-x-3">
                <span id="user-email-display" class="text-xs text-slate-400 hidden sm:inline"></span>
                <button id="logout-btn" class="bg-dark-700 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-sm transition">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Déconnexion
                </button>
            </div>
        </header>

        <!-- CONTENU PRINCIPAL -->
        <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 flex-1 space-y-6">
            
            <!-- SECTION STATS & AJOUT -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-dark-800 border border-slate-700 rounded-2xl p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 uppercase font-semibold">Séances Réalisées</p>
                        <h3 id="stat-completed" class="text-2xl font-bold mt-1 text-emerald-400">0 / 0</h3>
                    </div>
                    <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl">
                        <i class="fa-solid fa-check-circle"></i>
                    </div>
                </div>

                <div class="bg-dark-800 border border-slate-700 rounded-2xl p-4 md:col-span-2 flex items-center justify-between">
                    <div>
                        <h4 class="font-semibold text-slate-200">Ajouter une séance</h4>
                        <p class="text-xs text-slate-400 mt-0.5">Planifie ton prochain entraînement.</p>
                    </div>
                    <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center space-x-2 shadow-lg shadow-emerald-900/30">
                        <i class="fa-solid fa-plus"></i>
                        <span>Nouvelle séance</span>
                    </button>
                </div>
            </div>

            <!-- LISTE DES ENTRAÎNEMENTS -->
            <div class="bg-dark-800 border border-slate-700 rounded-2xl p-4 sm:p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-lg">Planning de la semaine</h3>
                    <span id="current-date-label" class="text-xs bg-dark-700 text-slate-300 px-3 py-1 rounded-full"></span>
                </div>

                <div id="workouts-list" class="space-y-3">
                    <!-- Les entraînements injectés ici dynamiquement -->
                </div>

                <div id="no-workouts" class="text-center py-12 text-slate-500 hidden">
                    <i class="fa-solid fa-calendar-xmark text-3xl mb-2"></i>
                    <p>Aucun entraînement planifié pour le moment.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL AJOUT ENTRAÎNEMENT -->
    <div id="workout-modal" class="fixed inset-0 bg-dark-950/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-dark-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Planifier un entraînement</h3>
            <form id="workout-form" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Titre de la séance</label>
                    <input type="text" id="w-title" required placeholder="Ex: 10km Endurance Fondamentale" class="w-full bg-dark-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Date</label>
                        <input type="date" id="w-date" required class="w-full bg-dark-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-1">Type</label>
                        <select id="w-type" class="w-full bg-dark-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Course">Course à pied</option>
                            <option value="Vélo">Vélo / Gravel</option>
                            <option value="Renfo">Renforcement</option>
                            <option value="Repos">Repos</option>
                        </select>
                    </div>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-dark-700 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl transition">Annuler</button>
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-900/30">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT APPLICATION -->
    <script>
        // ==========================================
        // CONFIGURATION SUPABASE (À REMPLACER)
        // ==========================================
        const SUPABASE_URL = 'https://dopgoecbdssvxexanavs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_5GrtRyqg1LV-wDZpFUxEnw_FHTDWbux';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;
        let workouts = [];

        // Éléments DOM
        const authScreen = document.getElementById('auth-screen');
        const appContent = document.getElementById('app-content');
        const authForm = document.getElementById('auth-form');
        const authTitle = document.getElementById('auth-title');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authToggleMode = document.getElementById('auth-toggle-mode');
        const authError = document.getElementById('auth-error');
        const workoutsList = document.getElementById('workouts-list');
        const noWorkouts = document.getElementById('no-workouts');
        const userEmailDisplay = document.getElementById('user-email-display');
        const workoutModal = document.getElementById('workout-modal');

        // Initialisation de l'auth
        async function initAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            handleSession(session);

            supabaseClient.auth.onAuthStateChange((event, session) => {
                handleSession(session);
            });
        }

        function handleSession(session) {
            if (session) {
                authScreen.classList.add('hidden');
                appContent.classList.remove('hidden');
                userEmailDisplay.textContent = session.user.email;
                fetchWorkouts();
            } else {
                authScreen.classList.remove('hidden');
                appContent.classList.add('hidden');
            }
        }

        // Gestion formulaire Auth (Connexion / Inscription)
        authToggleMode.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authTitle.textContent = isSignUp ? "Créer un compte" : "Connexion à ton Plan";
            authSubmitBtn.textContent = isSignUp ? "S'inscrire" : "Se connecter";
            authToggleMode.textContent = isSignUp ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
            authError.classList.add('hidden');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            let response;
            if (isSignUp) {
                response = await supabaseClient.auth.signUp({ email, password });
            } else {
                response = await supabaseClient.auth.signInWithPassword({ email, password });
            }

            if (response.error) {
                authError.textContent = response.error.message;
                authError.classList.remove('hidden');
            } else if (isSignUp && !response.data.session) {
                authError.textContent = "Inscription réussie ! Vérifie tes e-mails ou connecte-toi.";
                authError.classList.remove('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
        });

        // ==========================================
        // GESTION DES ENTRAÎNEMENTS
        // ==========================================
        async function fetchWorkouts() {
            const { data, error } = await supabaseClient
                .from('workouts')
                .select('*')
                .order('date', { ascending: true });

            if (!error) {
                workouts = data || [];
                renderWorkouts();
            }
        }

        function renderWorkouts() {
            workoutsList.innerHTML = '';
            
            if (workouts.length === 0) {
                noWorkouts.classList.remove('hidden');
                document.getElementById('stat-completed').textContent = `0 / 0`;
                return;
            }
            noWorkouts.classList.add('hidden');

            let completedCount = 0;

            workouts.forEach(w => {
                if (w.completed) completedCount++;

                const typeColors = {
                    'Course': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
                    'Vélo': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
                    'Renfo': 'bg-purple-500/10 text-purple-400 border-purple-500/20',
                    'Repos': 'bg-slate-700 text-slate-300 border-slate-600'
                };

                const badgeClass = typeColors[w.type] || 'bg-slate-700 text-slate-300 border-slate-600';

                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-4 rounded-xl border transition ${w.completed ? 'bg-dark-900/40 border-slate-800 opacity-60' : 'bg-dark-900 border-slate-700 shadow-sm'}`;
                item.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <button onclick="toggleWorkout('${w.id}', ${!w.completed})" class="w-7 h-7 rounded-lg border ${w.completed ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-600 hover:border-emerald-500'} flex items-center justify-center transition">
                            ${w.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        <div>
                            <h4 class="font-semibold text-sm sm:text-base ${w.completed ? 'line-through text-slate-500' : 'text-slate-100'}">${w.title}</h4>
                            <div class="flex items-center space-x-2 mt-1">
                                <span class="text-xs text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${w.date}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full border ${badgeClass}">${w.type}</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="deleteWorkout('${w.id}')" class="text-slate-500 hover:text-red-400 p-2 transition">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                workoutsList.appendChild(item);
            });

            document.getElementById('stat-completed').textContent = `${completedCount} / ${workouts.length}`;
        }

        async function toggleWorkout(id, status) {
            await supabaseClient.from('workouts').update({ completed: status }).eq('id', id);
            fetchWorkouts();
        }

        async function deleteWorkout(id) {
            await supabaseClient.from('workouts').delete().eq('id', id);
            fetchWorkouts();
        }

        // Modal Contrôle
        function openModal() {
            document.getElementById('w-date').valueAsDate = new Date();
            workoutModal.classList.remove('hidden');
        }
        function closeModal() {
            workoutModal.classList.add('hidden');
        }

        document.getElementById('workout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('w-title').value;
            const date = document.getElementById('w-date').value;
            const type = document.getElementById('w-type').value;

            const { data: { user } } = await supabaseClient.auth.getUser();

            const { error } = await supabaseClient.from('workouts').insert([
                { title, date, type, user_id: user.id, completed: false }
            ]);

            if (!error) {
                closeModal();
                document.getElementById('workout-form').reset();
                fetchWorkouts();
            }
        });

        // Date du jour dans le header
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date-label').textContent = new Date().toLocaleDateString('fr-FR', options);

        // Lancement
        initAuth();
    </script>
</body>
</html>
